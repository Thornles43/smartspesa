name: Deploy Firestore rules

on:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy-firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firestore rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/894849912142/locations/global/workloadIdentityPools/github-actions/providers/github
          audience: //iam.googleapis.com/projects/894849912142/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: smartspesa-rules-deployer@smartspesa-f9718.iam.gserviceaccount.com

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project smartspesa-f9718 --non-interactive

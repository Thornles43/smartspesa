name: Sync official supermarket catalogs

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync-official-catalogs.mjs"
      - ".github/workflows/sync-official-catalogs.yml"

permissions:
  contents: write

concurrency:
  group: official-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Import only official supermarket catalog pages
        run: node scripts/sync-official-catalogs.mjs
      - name: Validate catalog JSON and source attribution
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const d = JSON.parse(fs.readFileSync("data/official-catalogs.json", "utf8"));
          if (!Array.isArray(d.products) || !Array.isArray(d.sources)) throw new Error("Schema catalogo non valido");
          const allowed = {
            "Sole 365": ["sole365.it"],
            "Iper Rossetto / Rossetto": ["rossettogroup.it"]
          };
          const seen = new Set();
          const today = new Date().toISOString().slice(0, 10);
          for (const p of d.products) {
            if (!p.productName?.trim() || !p.supermarket?.trim() || p.sourceVerified !== true) throw new Error("Prodotto senza nome/insegna/fonte verificata");
            if (!p.sourceUrl || !p.sourceUrl.startsWith("https://")) throw new Error("URL fonte non HTTPS: " + p.productName);
            const url = new URL(p.sourceUrl);
            const domains = allowed[p.supermarket];
            if (!domains || !domains.some(domain => url.hostname === domain || url.hostname.endsWith("." + domain))) throw new Error("Fonte non autorizzata per " + p.supermarket + ": " + p.sourceUrl);
            if (p.price !== null && (!Number.isFinite(p.price) || p.price < 0 || p.price > 100000)) throw new Error("Prezzo non valido: " + p.productName);
            if (p.priceStatus === "official_promotion_with_expiry" && (!p.validUntil || p.validUntil < today)) throw new Error("Promozione scaduta o senza validità: " + p.productName);
            if (p.id && seen.has(p.id)) throw new Error("ID duplicato: " + p.id);
            if (p.id) seen.add(p.id);
          }
          for (const source of d.sources) {
            if (source.status === "ok" && (!Number.isFinite(source.productCount) || source.productCount < 1)) throw new Error("Fonte segnata OK senza prodotti: " + source.id);
          }
          console.log("Catalogo valido:", d.products.length, "prodotti; attribuzione fonti e scadenze controllate.");
          NODE
      - name: Commit catalog changes (retry on concurrent updates)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve the freshly generated catalogue while refreshing the branch before each push attempt.
          cp data/official-catalogs.json /tmp/official-catalogs-generated.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/official-catalogs-generated.json data/official-catalogs.json
            git add data/official-catalogs.json
            if git diff --cached --quiet; then
              echo "Nessun aggiornamento al catalogo"
              exit 0
            fi
            git commit -m "Aggiorna cataloghi ufficiali supermercati"
            if git push origin HEAD:main; then
              echo "Catalogo aggiornato al tentativo $attempt"
              exit 0
            fi
            echo "Push concorrente al tentativo $attempt; riprovo sul ramo aggiornato"
            sleep "$attempt"
          done
          echo "Impossibile pubblicare il catalogo dopo 3 tentativi"
          exit 1
